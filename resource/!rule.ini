[Template]
<pattern> = <<Name>_<Sz>dp_<Color>_FILL<Fill>_wght<weight>_GRAD<Grad>_opsz<Size>.svg>
<target> = <<Name><Color><Size>.svg>

[Map.Name]
<> = <string>
<bigtop_updates> = <Checker>
<computer_cancel> = <Uninstaller>
<drive_file_rename> = <Renamer>
<install_desktop> = <Installer>
<signature> = <Auth>

[Map.Sz]
<> = <digit>

[Map.Color]
<> = <string>
<000000> = <Light>
<FFFFFF> = <Dark>

[Map.Fill]
<> = <digit>

[Map.weight]
<> = <digit>

[Map.Grad]
<> = <string>

[Map.Size]
<> = <digit>
<20> = <Tiny>
<24> = <Taskbar>
<40> = <#40>
<48> = <#48>
