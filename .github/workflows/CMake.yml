name: Build

permissions: read-all

env:
  NINJA_STATUS: "[%r processes, %f/%t @ %o/s : %es]"

on:
  push:
    branches_ignore:
      - 'hotfix/*'
  pull_request:
    types: [ opened ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      type:
        description: 'Construction Type'
        required: true
        default: 'Test'
        type: choice
        options:
          - Release
          - Debug
          - Test

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Install MinGW 16.2.0
        shell: pwsh
        run: |
          $toolchainRoot = Join-Path $env:RUNNER_TEMP "mingw-16.2.0"
          $archive = Join-Path $env:RUNNER_TEMP "mingw-16.2.0.7z"
          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-win32-seh-ucrt-rt_v14-rev1.7z"
          $expectedHash = "c9ae8e4a3afa667b3301dd28c567109d174a0fa0856a2eeaa85a91b89569a50b"
          curl.exe --fail --location --retry 3 --output $archive $url
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash)
          {
            throw "MinGW archive SHA-256 mismatch: $actualHash"
          }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          & $sevenZip x $archive "-o$toolchainRoot" -y
          if ($LASTEXITCODE -ne 0)
          {
            throw "Failed to extract MinGW archive."
          }
          $compilerBin = Join-Path $toolchainRoot "mingw64\bin"
          if (-not (Test-Path -LiteralPath "$compilerBin\g++.exe"))
          {
            throw "MinGW compiler was not found after extraction: $compilerBin"
          }
          "MINGW_ROOT=$toolchainRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$compilerBin\g++.exe" --version

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake of Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' && inputs.type == 'Release'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G "Ninja" "-DCMAKE_C_COMPILER=$env:MINGW_ROOT\mingw64\bin\gcc.exe" "-DCMAKE_CXX_COMPILER=$env:MINGW_ROOT\mingw64\bin\g++.exe"

      - name: Configure CMake of Debug
        if: github.event_name == 'workflow_dispatch' && inputs.type == 'Debug'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -G "Ninja" "-DCMAKE_C_COMPILER=$env:MINGW_ROOT\mingw64\bin\gcc.exe" "-DCMAKE_CXX_COMPILER=$env:MINGW_ROOT\mingw64\bin\g++.exe"

      - name: Configure CMake of Test
        if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.type == 'Test')
        run: cmake -B build -DCMAKE_BUILD_TYPE=Test -G "Ninja" "-DCMAKE_C_COMPILER=$env:MINGW_ROOT\mingw64\bin\gcc.exe" "-DCMAKE_CXX_COMPILER=$env:MINGW_ROOT\mingw64\bin\g++.exe"

      - name: Build
        working-directory: build
        run: ninja -j 0 -v

      - name: Create an Setup Wizard
        working-directory: build
        run: ninja -j 0 -v build

      - name: Deploy
        working-directory: build
        run: |
          $setup = Get-ChildItem -Filter "OpenVPNConfigManagerSetup-*.exe" | Select-Object -First 1
          if (-not $setup)
          {
            Write-Error "Package not found."
            exit 1
          }
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $authPaths = @(
            "$env:GITHUB_WORKSPACE\build\install\Auth.exe",
            "C:\Program Files (x86)\OpenVPN Config Manager\Auth.exe"
          )
          foreach ($path in $authPaths)
          {
            if (-not (Test-Path -LiteralPath $path))
            {
              throw "Auth.exe not found: $path"
            }
            Get-Item -LiteralPath $path | Select-Object FullName, Length
            Get-FileHash -LiteralPath $path -Algorithm SHA256
          }
          $hashes = @($authPaths | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash })
          if ($hashes[0] -ne $hashes[1])
          {
            throw "Packaged and installed Auth.exe hashes do not match."
          }
          echo "C:\Program Files (x86)\OpenVPN Config Manager" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test
        if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.type == 'Test')
        working-directory: build
        run: ctest --output-on-failure --verbose

      - name: Create Attachments
        working-directory: build
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run : |
          ninja -j 0 -v zip

      - name: Upload Setup Wizard
        uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          path: build/OpenVPNConfigManagerSetup-*.exe
          archive: false

      - name: Upload Zip File
        uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          path: build/OpenVPNConfigManagerSetup-*.zip
          archive: false

      - name: Upload to Release
        uses: svenstaro/upload-release-action@2.11.5
        if: github.event_name == 'release'
        with:
          file: build/*.{exe,zip}
          overwrite: true
          file_glob: true
          draft: false
