name: Build

permissions: read-all

env:
  NINJA_STATUS: "[%r processes, %f/%t @ %o/s : %es]"

on:
  push:
    branches_ignore:
      - 'hotfix/*'
  pull_request:
    types: [ opened ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      type:
        description: 'Construction Type'
        required: true
        default: 'Test'
        type: choice
        options:
          - Release
          - Debug
          - Test

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake of Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' && inputs.type == 'Release'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G "Ninja"

      - name: Configure CMake of Debug
        if: github.event_name == 'workflow_dispatch' && inputs.type == 'Debug'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -G "Ninja"

      - name: Configure CMake of Test
        if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.type == 'Test')
        run: cmake -B build -DCMAKE_BUILD_TYPE=Test -G "Ninja"

      - name: Build
        working-directory: build
        run: ninja -j 0 -v

      - name: Create an Setup Wizard
        working-directory: build
        run: ninja -j 0 -v build

      - name: Deploy
        working-directory: build
        run: |
          $setup = Get-ChildItem -Filter "OpenVPNConfigManagerSetup-*.exe" | Select-Object -First 1
          if (-not $setup)
          {
            Write-Error "Package not found."
            exit 1
          }
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $runtimeDir = "$env:GITHUB_WORKSPACE\build\auth-runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $runtimeFiles = @()
          foreach ($name in @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll"))
          {
            $runtime = $env:PATH -split ';' |
              ForEach-Object { if ($_ -and (Test-Path -LiteralPath (Join-Path $_ $name))) { Join-Path $_ $name } } |
              Select-Object -First 1
            if ($runtime)
            {
              Write-Output "Runner runtime: $runtime"
              Copy-Item -LiteralPath $runtime -Destination "$runtimeDir\$name" -Force
              $runtimeFiles += "$runtimeDir\$name"
              Get-FileHash -LiteralPath "$runtimeDir\$name" -Algorithm SHA256
            }
          }
          if ($runtimeFiles.Count -eq 0)
          {
            "No MinGW runtime DLLs were found on the runner PATH." | Out-File -FilePath "$runtimeDir\README.txt" -Encoding utf8
          }
          Compress-Archive -Path "$runtimeDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\build\auth-runtime.zip" -Force
          $authPaths = @(
            "$env:GITHUB_WORKSPACE\build\install\Auth.exe",
            "C:\Program Files (x86)\OpenVPN Config Manager\Auth.exe"
          )
          foreach ($path in $authPaths)
          {
            if (-not (Test-Path -LiteralPath $path))
            {
              throw "Auth.exe not found: $path"
            }
            Get-Item -LiteralPath $path | Select-Object FullName, Length
            Get-FileHash -LiteralPath $path -Algorithm SHA256
          }
          $hashes = @($authPaths | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash })
          if ($hashes[0] -ne $hashes[1])
          {
            throw "Packaged and installed Auth.exe hashes do not match."
          }
          echo "C:\Program Files (x86)\OpenVPN Config Manager" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test
        if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.type == 'Test')
        working-directory: build
        run: ctest --output-on-failure --verbose

      - name: Create Attachments
        working-directory: build
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run : |
          ninja -j 0 -v zip

      - name: Upload Setup Wizard
        uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          path: build/OpenVPNConfigManagerSetup-*.exe
          archive: false

      - name: Upload Zip File
        uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          path: build/OpenVPNConfigManagerSetup-*.zip
          archive: false

      - name: Upload Auth Runtime
        uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Auth-runtime-diagnostics
          path: build/auth-runtime.zip
          archive: false

      - name: Upload to Release
        uses: svenstaro/upload-release-action@2.11.5
        if: github.event_name == 'release'
        with:
          file: build/*.{exe,zip}
          overwrite: true
          file_glob: true
          draft: false
