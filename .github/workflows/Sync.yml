name: Synchronize Third-Party Repositories

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: "Asia/Shanghai"
  pull_request:
    branches: "bot/*"
    types: [closed]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  inih:
    runs-on: ubuntu-latest
    environment: Signing
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@main

    - name: Fetch Latest Source Code
      id: fetch
      run: |
        set -euo pipefail
        echo "old_version=$(sed -nE "s/^[[:space:]]*set[[:space:]]*\([[:space:]]*VERSION[[:space:]]+([0-9]+)[[:space:]]*\).*/\1/p" inih/CMakeLists.txt | head -1)" >> "$GITHUB_OUTPUT"
        rm -rf /tmp/inih
        git clone --depth=1 https://github.com/benhoyt/inih.git /tmp/inih
        echo "new_version=$(sed -nE "s/.*version[[:space:]]*:[[:space:]]*'([0-9]+)'.*/\1/p" /tmp/inih/meson.build | head -1)" >> "$GITHUB_OUTPUT"
        echo "sha=$(git -C /tmp/inih rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "date=$(git -C /tmp/inih log -1 --date=iso-local --format=%cs)" >> "$GITHUB_OUTPUT"
        echo "time=$(git -C /tmp/inih log -1 --date=iso-local --format=%cd)" >> "$GITHUB_OUTPUT"

    - name: Update Repository
      run: |
        set -euo pipefail
        mkdir -p inih/cpp
        cp /tmp/inih/ini.c              inih/ini.c
        cp /tmp/inih/ini.h              inih/ini.h
        cp /tmp/inih/LICENSE.txt        inih/LICENSE.txt
        cp /tmp/inih/cpp/INIReader.h    inih/cpp/INIReader.h
        cp /tmp/inih/cpp/INIReader.cpp  inih/cpp/INIReader.cpp
        sed -i -E "s/^([[:space:]]*set[[:space:]]*\([[:space:]]*VERSION[[:space:]]+)[0-9]+(.*)/\1${{ steps.fetch.outputs.new_version }}\2/" inih/CMakeLists.txt

    - name: Import GPG Key
      uses: crazy-max/ghaction-import-gpg@master
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        trust_level: 5
        git_tag_gpgsign: true
        git_config_global: true
        git_commit_gpgsign: true
        git_user_signingkey: true

    - name: Create Pull Request
      id: create-pr
      uses: peter-evans/create-pull-request@main
      with:
        author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        branch: bot/Inih
        commit-message: "Update Inih"
        title: "Update Inih to version ${{ steps.fetch.outputs.new_version }} committed on ${{ steps.fetch.outputs.date }}"
        add-paths: inih
        delete-branch: true
        sign-commits: true
        labels: |
          Bot
          Workflow

    - name: Update PR Body
      if: ${{ steps.create-pr.outputs.pull-request-number }}   # a PR updated
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cat << "EOF" | gh pr edit ${{ steps.create-pr.outputs.pull-request-number }} --body-file -
        This PR is created by Github Actions.

        - Old version : `${{ steps.fetch.outputs.old_version }}` 
        - New version : `${{ steps.fetch.outputs.new_version }}` 
        - Commit date : `${{ steps.fetch.outputs.time }}` 
        - SHA-1 : `${{ steps.fetch.outputs.sha }}`

        Please inspect the changes manually before merging.
        EOF

  Google-Test:
    runs-on: ubuntu-latest
    environment: Signing
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@main

    - name: Fetch Latest Source Code
      id: fetch
      run: |
        set -euo pipefail
        echo "old_version=$(sed -nE "s/^[[:space:]]*set\(GOOGLETEST_VERSION[[:space:]]+([0-9.]+)[[:space:]]*\).*/\1/p" googletest/CMakeLists.txt | head -1)" >> "$GITHUB_OUTPUT"
        rm -rf googletest
        git clone --depth=1 https://github.com/google/googletest.git
        echo "new_version=$(sed -nE "s/^[[:space:]]*set\(GOOGLETEST_VERSION[[:space:]]+([0-9.]+)[[:space:]]*\).*/\1/p" googletest/CMakeLists.txt | head -1)" >> "$GITHUB_OUTPUT"
        echo "sha=$(git -C googletest rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "date=$(git -C googletest log -1 --date=iso-local --format=%cs)" >> "$GITHUB_OUTPUT"
        echo "time=$(git -C googletest log -1 --date=iso-local --format=%cd)" >> "$GITHUB_OUTPUT"
        rm -rf googletest/.git

    - name: Import GPG Key
      uses: crazy-max/ghaction-import-gpg@master
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        trust_level: 5
        git_tag_gpgsign: true
        git_config_global: true
        git_commit_gpgsign: true
        git_user_signingkey: true

    - name: Create Pull Request
      id: create-pr
      uses: peter-evans/create-pull-request@main
      with:
        author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        branch: bot/GoogleTest
        commit-message: "Update Google Test"
        title: "Update Google Test to version ${{ steps.fetch.outputs.new_version }} committed on ${{ steps.fetch.outputs.date }}"
        add-paths: googletest
        delete-branch: true
        sign-commits: true
        labels: |
          Bot
          Workflow

    - name: Update PR Body
      if: ${{ steps.create-pr.outputs.pull-request-number }}   # a PR updated
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cat << "EOF" | gh pr edit ${{ steps.create-pr.outputs.pull-request-number }} --body-file -
        This PR is created by Github Actions.

        - Old version : `${{ steps.fetch.outputs.old_version }}` 
        - New version : `${{ steps.fetch.outputs.new_version }}` 
        - Commit date : `${{ steps.fetch.outputs.time }}` 
        - SHA-1 : `${{ steps.fetch.outputs.sha }}`

        Please inspect the changes manually before merging.
        EOF
