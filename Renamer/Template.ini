[Template]
pattern = <Country>-free-<id>.protonvpn.<protocal>.ovpn
target = <Country>#<id>-<protocal>.ovpn

[Map.Country]
<> = str
<pl> = <Poland>
<nl> = <Netherlands>
<ca> = <Canada>
<ro> = <Romania>
<us> = <UnitedStates>
<mx> = <Mexico>
<no> = <Norway>
<jp> = <Japan>
<ch> = <Switzerland>
<sg> = <Singapore>

[Map.id]
<> = keep

[Map.protocal]
<> = str
<udp> = <UDP>
<tcp> = <TCP>
