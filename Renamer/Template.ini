[Template]
<pattern> = <<Country>-<id>.<protocal>.ovpn>
<target> = <<Country>#<id>-<protocal>.ovpn>

[Map.Country]
<> = <string>
<ca> = <Canada>
<ch> = <Switzerland>
<jp> = <Japan>
<mx> = <Mexico>
<nl> = <Netherlands>
<no> = <Norway>
<pl> = <Poland>
<ro> = <Romania>
<sg> = <Singapore>
<uk> = <UnitedKingdom>
<us> = <UnitedStates>

[Map.id]
<> = <digit>

[Map.protocal]
<> = <string>
<udp> = <UDP>
<tcp> = <TCP>
